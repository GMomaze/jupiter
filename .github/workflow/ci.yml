name: PROJECT JUPITER CI
on:
  pull_request:
    branches: [ main ]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Linting (Rule 0.3)
        run: npm run lint

      - name: Strict Type Check (Rule 0.3)
        run: npx tsc --noEmit

      - name: Security Scan (Rule 0.5)
        # This checks for committed passwords/keys
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD