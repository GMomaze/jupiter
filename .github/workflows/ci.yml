name: Jupiter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jupiter_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jupiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jupiter_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://jupiter_test:test@localhost:5432/jupiter_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Run migrations using ts-node loader
      - run: node --loader ts-node/esm ./node_modules/knex/bin/cli.js migrate:latest --env test

      # Run seeds using ts-node loader
      - run: node --loader ts-node/esm ./node_modules/knex/bin/cli.js seed:run --env test

      - run: npm run test